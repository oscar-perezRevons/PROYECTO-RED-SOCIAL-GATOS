
<div class="controls-section">
  <h2>Gestión de Imágenes</h2>
  
  <div class="search-filters">
    <div class="search-box">
      <input 
        type="text" 
        [(ngModel)]="searchTerm" 
        (ngModelChange)="aplicarFiltros()"
        placeholder="Buscar por raza..." 
        class="search-input"
      />
    </div>
    
    <div class="sort-box">
      <label for="sortBy">Ordenar por:</label>
      <select 
        id="sortBy" 
        [(ngModel)]="sortBy" 
        (ngModelChange)="aplicarFiltros()"
        class="sort-select"
      >
        <option value="none">Sin ordenar</option>
        <option value="breed-asc">Raza (A-Z)</option>
        <option value="breed-desc">Raza (Z-A)</option>
        <option value="id-asc">Más antiguas</option>
        <option value="id-desc">Más recientes</option>
      </select>
    </div>
    
    <button (click)="limpiarFiltros()" class="clear-btn">Limpiar filtros</button>
  </div>

  <div class="breed-search">
    <input type="text" [(ngModel)]="breedName" placeholder="Ej: Siamese" class="breed-input" />
    <button (click)="getImagesByBreed(breedName)" class="search-btn">Buscar por Raza</button>
  </div>
</div>

<div *ngIf="isLoading" class="loading-message">Cargando imágenes...</div>

<div class="carrusel">
  <h2>Todas las imágenes</h2>
  <div>

<div *ngFor="let img of listaDeImagenesPorRaza">
  @if (img.id_image===1) {
    <h2>Imágenes de la raza '{{breedName}}'</h2>
  }
  <img [src]="img.url_image" [alt]="img.name_breed" width="300" />
</div>

    @for (imagen of listaFiltrada; track imagen.id_image) {
    <div class="card-content">
      <img src="{{imagen.url_image}}" alt="Imagen">
      <h3>raza: {{imagen.name_breed}} </h3>
      <div class="iconos">
        <!--   -->
        <button class="search" (click)="agregarFavorito(imagen.id_image)">❤️</button>
        <button class="search" (click)="deleteImage(imagen.id_image)">🗑️</button>
      </div>
    </div>
    } @empty {
    <h2>No existen imágenes de gatos</h2>
    }
  </div>
</div>
